name = "portfolio-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Custom domain: the zone oliverseydlitz.com must be on this Cloudflare account.
routes = [
  { pattern = "portfolio.oliverseydlitz.com", custom_domain = true }
]

[observability]
enabled = true

# Non-secret config. Secrets (GITHUB_*, COOKIE_ENCRYPTION_KEY, ALPACA_*) are set
# with `wrangler secret put` and must never appear in this file.
[vars]
PUBLIC_URL = "https://portfolio.oliverseydlitz.com"
ALLOWED_GITHUB_LOGIN = "REPLACE_WITH_YOUR_GITHUB_LOGIN"
MAX_ORDER_PCT = "10"
MAX_POSITION_PCT = "20"
MAX_ORDERS_PER_DAY = "10"
SYMBOL_ALLOWLIST = ""

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_AFTER_wrangler_kv_namespace_create"

[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
database_id = "REPLACE_AFTER_wrangler_d1_create"
migrations_dir = "migrations"
